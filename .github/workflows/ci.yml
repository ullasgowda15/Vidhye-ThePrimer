name: CI

on:
  pull_request:
  # `deploy.yml` calls this workflow so the gating jobs are re-run on the commit
  # being shipped, rather than the deploy trusting that some ancestor was green.
  # A tag can point anywhere, including at a commit that was never on main.
  #
  # **There is deliberately no `push:` trigger for main.** `deploy.yml` runs on
  # every push to main and its first act is to call this workflow, so main is
  # still covered on every commit — by exactly one run instead of two. Adding
  # `push: branches: [main]` back would double every push: five jobs here plus
  # the same five again inside the deploy run, including the full eval suite,
  # for no extra information.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # Same image as local dev so the pgvector extension exists in CI too.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: primer
          POSTGRES_PASSWORD: primer
          POSTGRES_DB: primer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primer -d primer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-not-used-in-production
      DEBUG: '1'
      DATABASE_URL: postgres://primer:primer@localhost:5432/primer
      REDIS_URL: redis://localhost:6379/0
      # Deliberately empty: CI must never call a real provider. Every AI test stubs
      # the provider out, so an empty key here is also a guard — if a test ever tries
      # to make a live call, it fails on configuration instead of spending money.
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        # **Blocking since the Day-15 review (P2-3).** It was `continue-on-error`
        # while annotations were still being added, with a note to flip it once the
        # suite had been clean for a few days running. It has been: `b91acaf`
        # cleared the last nine carried errors on Day 14 and every run since has
        # reported 0 issues in 260 source files. Leaving it advisory past that point
        # only means the next type regression lands under a green tick.
        run: mypy .

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        working-directory: backend
        run: python manage.py migrate

      - name: Test (pytest)
        working-directory: backend
        run: pytest

      - name: Export OpenAPI schema
        working-directory: backend
        run: python manage.py spectacular --format openapi-json --file ../frontend/openapi.json

      - name: Fail if the committed OpenAPI schema is stale
        # The generated TS client is only trustworthy if the committed schema
        # matches the code that produced it.
        run: git diff --exit-code -- frontend/openapi.json

      - name: Smoke-test the ASGI app
        working-directory: backend
        run: |
          python -m uvicorn config.asgi:application --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health/ && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health/ | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/schema/
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/docs/

      - name: Smoke-test the Celery worker
        working-directory: backend
        run: |
          celery -A config worker -l warning --detach --pidfile=/tmp/celery.pid --logfile=/tmp/celery.log
          # Wait for the worker to actually answer, rather than guessing with a fixed
          # sleep — a slow runner turns that into a flaky failure that looks like a
          # broken worker. `inspect ping` exits non-zero until someone replies.
          for _ in $(seq 1 30); do
            celery -A config inspect ping --timeout 2 >/dev/null 2>&1 && break
            sleep 1
          done
          celery -A config inspect ping --timeout 5 || { cat /tmp/celery.log; exit 1; }
          python manage.py shell -c "from apps.common.tasks import ping; assert ping.delay().get(timeout=30) == 'pong'"

  evals:
    # PRODUCT.md §19.7's ship gate. **This is a required check on the deploy
    # workflow** (see deploy.yml's `needs:`), which is what makes "a change that
    # regresses safety or coherence beyond threshold cannot deploy" a fact about
    # the pipeline rather than an intention.
    #
    # Its own job rather than a step in `backend`, for two reasons: it is the
    # status check a human points at and a branch protection rule names, and a
    # red eval must be distinguishable at a glance from a red unit test — they
    # mean different things and are fixed by different people.
    name: Evals
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: primer
          POSTGRES_PASSWORD: primer
          POSTGRES_DB: primer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primer -d primer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-not-used-in-production
      DEBUG: '1'
      DATABASE_URL: postgres://primer:primer@localhost:5432/primer
      REDIS_URL: redis://localhost:6379/0
      # The gate runs against the scripted provider and spends nothing. Empty keys
      # are the guard as well as the configuration: a grader that tried to reach a
      # real model would fail on configuration instead of on a vendor's bad
      # afternoon, which is what keeps this gate worth having.
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check evals
          ruff format --check evals

      - name: Migrate
        working-directory: backend
        run: python manage.py migrate

      - name: Eval suite (golden + red-team + age rubric + regression)
        run: pytest evals/ -q

  deps:
    # PRODUCT.md §16.1, and the Day 1–15 audit's F-8.
    #
    # Pinning every version is correct and is also exactly what turns
    # "reproducible" into "reproducibly stale". Fifteen build-days shipped on
    # Django 5.1.5 with 26 open advisories, on the `cryptography` release that
    # encrypts `Memory.content` (§11.10) with 8, and on the `simplejwt` that is
    # the whole auth story with 1 — while CI linted, type-checked, tested,
    # ran the eval gate and built an image, and never once asked whether the
    # dependencies were safe.
    #
    # **Blocking, both halves.** The brief that commissioned this job said
    # "non-blocking for a sprint and blocking before families"; the sprint is
    # over and families are next, so it starts blocking. A dependency job that
    # only warns is a dependency job whose output nobody reads.
    #
    # Its own job rather than a step in `backend`, for the reason `evals` is one:
    # a red dependency audit means something different from a red test, is fixed
    # by a different action (a version bump, not a code change), and should be
    # distinguishable at a glance.
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install pip-audit
        run: pip install -r backend/requirements-dev.txt

      - name: Audit backend dependencies (pip-audit)
        # `requirements.txt` and not `-dev.txt`: this is the runtime surface —
        # what `infra/Dockerfile.backend` installs and what a family's data
        # actually passes through. A test-runner advisory is a real thing to fix
        # but it is not a reason to block a deploy at 3am, and a gate that goes
        # red for reasons unrelated to the risk is a gate somebody disables.
        run: pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        # `--audit-level=high` is the blocking bar. Moderate findings still print
        # and are still worth taking; blocking on them would mean the build going
        # red for a transitive dev-tool advisory in a package that never reaches
        # a browser.
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint + prettier)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Fail if the generated API client is stale
        working-directory: frontend
        run: |
          npm run client
          git diff --exit-code -- src/lib/api/schema.ts

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      # Kept, so that `deploy.yml` can ship this exact directory rather than
      # rebuilding it — production then serves the bytes these tests ran against,
      # and `app-server` (3.8 GiB, shared with Postgres and Celery) never has to
      # run a Vite build. Seven days is well past any deploy that would want it.
      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -f infra/Dockerfile.backend -t primer-backend:ci .
