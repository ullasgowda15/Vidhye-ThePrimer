[project]
name = "primer-backend"
version = "0.1.0"
description = "The Primer — AI-generated living storybook (backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# `apps/reading/engine` is vendored, not authored here (Docs/Build/Reading-Integration.md
# §7). Restyling it — `List` to `list`, import order, line lengths — would touch
# every file and destroy the property that makes vendoring worth doing: a readable
# diff against upstream, so a fix made in either place can be carried to the other.
# The engine earns its keep through its tests (`apps/reading/tests`), not through
# matching this repo's house style. Code we write *around* it is not excluded.
extend-exclude = ["**/migrations/*", "apps/reading/engine/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "B008",   # function call in default arg — common in DRF/Django idioms
    "RUF012", # mutable class attrs need ClassVar — noisy on Django Meta/admin
]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF002 flag characters that look like ASCII and are not — a Greek iota
# posing as an I, a fullwidth bracket posing as `<`. These three files are *about*
# exactly that: the confusables table that folds them, the red-team corpus that
# attacks with them, and the tests that assert on both. The rule is there to catch
# one arriving by accident; here every one is deliberate and load-bearing.
"apps/safety/scrub.py" = ["RUF001", "RUF002"]
"apps/safety/redteam/corpus.py" = ["RUF001", "RUF002"]
"apps/safety/redteam/test_redteam.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
# Loose on Day 1 — tightened as the codebase grows.
check_untyped_defs = true
warn_unused_ignores = false
# See the ruff note above: the vendored reading engine is excluded for the same
# reason, plus one of its own — it imports torch and faster-whisper, which are
# deliberately not installed on this box (§2.1), so mypy could only ever report
# them as missing.
exclude = ["migrations/", "apps/reading/engine/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# `exclude` above stops mypy *crawling* the vendored engine; this stops it
# reporting on the modules our own code imports from it. Both are needed, exactly
# as they are for migrations. The engine is checked by its tests, not its
# annotations — it predates this repo's typing conventions and rewriting it to
# satisfy them would throw away the diff against upstream.
[[tool.mypy.overrides]]
module = ["apps.reading.engine.*"]
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
# `tests/` holds cross-cutting API tests; unit tests for a component live beside
# it under `apps/` so they move with the code they describe.
testpaths = ["tests", "apps"]
addopts = "-q"
